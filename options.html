<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><title>Gemini GitHub Bridge</title><style>body{font:15px Arial;max-width:760px;margin:40px auto;padding:0 18px;color:#202124}h1{font-size:24px}label{display:block;margin:16px 0 6px;font-weight:700}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:9px}button{margin-top:18px;padding:10px 16px;border:0;border-radius:20px;background:#0b57d0;color:#fff;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{background:#f1f3f4;padding:12px;border-radius:10px;margin:14px 0}.status{margin-top:12px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}</style><h1>Gemini GitHub Bridge</h1><div class="note">הטוקן נשמר מקומית בתוך Chrome Storage ונשלח רק ל־GitHub API. הוא לעולם לא מוכנס לפרומפט של Gemini.</div><label>GitHub fine-grained token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"><label>מאגר</label><input id="repository" placeholder="owner/repository"><div class="row"><div><label>ענף בסיס</label><input id="branch" value="main"></div><div><label>מצב ברירת מחדל</label><select id="defaultMode"><option value="branch_pr">Branch + Pull Request</option><option value="commit">Commit ישיר</option></select></div></div><label class="check"><input type="checkbox" id="protocolEnabled" checked> הוסף אוטומטית את פרוטוקול ה־JSON לבקשות קוד ב-Gemini</label><button id="save">שמור ובדוק חיבור</button><div id="status" class="status"></div><script src="options.js"></script></html>
